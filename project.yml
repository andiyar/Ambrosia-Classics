# Ambrosia Classics — xcodegen spec. `xcodegen generate` writes AmbrosiaClassics.xcodeproj
# (git-ignored). Never hand-edit the pbxproj; this file is the truth.
name: AmbrosiaClassics
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  AkiCore:
    path: Aki/Core
  BubbleTroubleCore:
    path: BubbleTrouble/BubbleTroubleCore
  # Through the `Deimos/DeimosCore → Core` symlink: SwiftPM names a local package after its directory, and
  # Aki/Core is already "core" (BTX precedent, DECISIONS D13.8).
  DeimosCore:
    path: Deimos/DeimosCore
  # Through the `Ferazel/FerazelCore → Core` symlink, as Deimos (D13.8): Aki/Core is already "core".
  FerazelCore:
    path: Ferazel/FerazelCore
  HectorKit:
    path: ../HectorKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Aki:
    type: application
    platform: macOS
    sources:
      - path: Aki/App
        excludes:
          - "Mac/Info.plist"
          - "iOS/**"
    dependencies:
      - package: AkiCore
        product: AkiCore
      - package: HectorKit
        product: HectorShell
    settings:
      base:
        PRODUCT_NAME: Aki
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.aki
        INFOPLIST_FILE: Aki/App/Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        # macOS 26+ app icon (Ben 2026-10-06): Icon Composer document Aki/App/Mac/AppIcon.icon — the original
        # aki.icns tile art on green felt, so the system draws the squircle instead of jailing the 2008 icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The iPad app (plan C6, D7): the same shared Aki/App code over HectorShell's iOS shell, host in Aki/App/iOS.
  AkiPad:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Aki/App
        excludes:
          - "Mac/**"
          - "iOS/Info.plist"
    dependencies:
      - package: AkiCore
        product: AkiCore
      - package: HectorKit
        product: HectorShell
    settings:
      base:
        PRODUCT_NAME: Aki
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.aki.ipad
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        DEVELOPMENT_TEAM: 5W72UJL332
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_FILE: Aki/App/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMPRESS_PNG_FILES: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts:
      # The ORIGINAL Aki 1.2.0 Contents/Resources, unchanged, into the bundle root (before signing), plus
      # Apple's OsakaMono.ttf for the Release Notes (UIAppFonts) when this Mac has it — as tools/stage-aki.sh.
      - name: Copy original Aki data
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          DATA="${AKI_DATA_12:-$SRCROOT/Resources/Aki/1.2.0.app/Contents/Resources}"
          if [ ! -f "$DATA/map.png" ]; then
            echo "error: AkiPad: no Aki 1.2.0 Contents/Resources at $DATA (set AKI_DATA_12)" >&2
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          rsync -a --exclude '.DS_Store' --exclude '*.icns' "$DATA/" "$DEST/"
          # Remaster (D11): the git-ignored U1 art set into <bundle>/hd-4x/ when present (else Remaster shows
          # disabled), mirrored with --delete so a stale set never lingers in derived data (as tools/stage-aki.sh).
          HD="$SRCROOT/Resources/Aki/hd-4x"
          if [ -d "$HD" ]; then
            rsync -a --delete --exclude '.DS_Store' "$HD/" "$DEST/hd-4x/"
            echo "AkiPad: hd-4x staged ($(du -sh "$DEST/hd-4x" | cut -f1))"
          else
            rm -rf "$DEST/hd-4x"
            echo "warning: AkiPad: no $HD; Remastered Art will show disabled"
          fi
          OSAKA="$(find /System/Library/AssetsV2 -name OsakaMono.ttf -print -quit 2>/dev/null || true)"
          if [ -n "$OSAKA" ]; then
            cp "$OSAKA" "$DEST/OsakaMono.ttf"
          else
            echo "warning: AkiPad: OsakaMono.ttf not found under /System/Library/AssetsV2; Release Notes fall back to Menlo"
          fi

  BubbleTroubleX:
    type: application
    platform: macOS
    sources:
      - path: BubbleTroubleX/App
        excludes: ["Info.plist"]
      - path: BubbleTroubleX/Shared
    dependencies:
      - package: BubbleTroubleCore
        product: BubbleTroubleCore
      - package: BubbleTroubleCore
        product: BubbleTroubleRender
      - package: HectorKit
        product: HectorShell
      - package: HectorKit
        product: HectorInput
    settings:
      base:
        PRODUCT_NAME: "Bubble Trouble X"
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.bubbletroublex
        INFOPLIST_FILE: BubbleTroubleX/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
  # Deimos Rising (plan 2026-10-06-deimos-phase1 S7, A1): the original's own OS X icon (`icns 128`, verbatim) as
  # AppIcon.icns; the 1.0.6 Data folder is staged into Contents/Resources/Deimos/Data by tools/stage-deimos.sh.
  Deimos:
    type: application
    platform: macOS
    sources:
      - path: Deimos/App
        excludes: ["Info.plist"]
    dependencies:
      - package: DeimosCore
        product: DeimosCore
      - package: DeimosCore
        product: DeimosRender
      - package: DeimosCore
        product: DeimosHost
      - package: DeimosCore
        product: DeimosAudio
      - package: HectorKit
        product: HectorShell
      # Phase 4 S8a: the app decodes its resource fork's PICTs (ruling 9) and builds the pad layouts (HectorInput).
      - package: HectorKit
        product: HectorGraphics
      - package: HectorKit
        product: HectorInput
    settings:
      base:
        PRODUCT_NAME: "Deimos Rising"
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.deimos
        INFOPLIST_FILE: Deimos/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      # The app's own resource fork as committed (the developer logo PICT 1000, the dialogs' DLOG/DITL/STR#/tab#,
      # the controls window's PICTs; Phase 4 S6 BT, ruling 9) into Contents/Resources/Deimos/ beside the staged
      # Data folder, before signing; the shell reads it and hands it to Core (`FrontEndState.shellResources`, S8a).
      - name: Copy Deimos Rising.rsrc
        inputFiles:
          - "$(SRCROOT)/Resources/Deimos/Deimos Rising.rsrc"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Deimos/Deimos Rising.rsrc"
        script: |
          set -euo pipefail
          SRC="$SRCROOT/Resources/Deimos/Deimos Rising.rsrc"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Deimos"
          if [ ! -f "$SRC" ]; then
            echo "error: Deimos: no app resource fork at $SRC" >&2
            exit 1
          fi
          mkdir -p "$DEST"
          cp "$SRC" "$DEST/Deimos Rising.rsrc"
  # Ferazel's Wand (plan 2026-10-06-ferazel-phase1 S5/S6, A1): the original 1.0.3 data is staged into
  # Contents/Resources/Ferazel by tools/stage-ferazel.sh (A2); the icon is the original icl8 128 scaled x16 (AppIcon.icon).
  Ferazel:
    type: application
    platform: macOS
    sources:
      - path: Ferazel/App
        excludes: ["Info.plist"]
      # The platform-neutral shell half shared with the Windows build (Phase W, WF1, D43 Ruling 1).
      - path: Ferazel/Shared
    dependencies:
      - package: FerazelCore
        product: FerazelCore
      - package: FerazelCore
        product: FerazelRender
      - package: HectorKit
        product: HectorShell
    settings:
      base:
        PRODUCT_NAME: "Ferazel's Wand"
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.ferazel
        INFOPLIST_FILE: Ferazel/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
schemes:
  Aki:
    build:
      targets:
        Aki: all
  AkiPad:
    build:
      targets:
        AkiPad: all
  BubbleTroubleX:
    build:
      targets:
        BubbleTroubleX: all
  Deimos:
    build:
      targets:
        Deimos: all
  Ferazel:
    build:
      targets:
        Ferazel: all
