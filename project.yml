# Ambrosia Classics — xcodegen spec. `xcodegen generate` writes AmbrosiaClassics.xcodeproj
# (git-ignored). Never hand-edit the pbxproj; this file is the truth.
name: AmbrosiaClassics
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  AkiCore:
    path: Aki/Core
  HectorKit:
    path: ../HectorKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Aki:
    type: application
    platform: macOS
    sources:
      - path: Aki/App
        excludes:
          - "Info.plist"
    dependencies:
      - package: AkiCore
        product: AkiCore
      - package: HectorKit
        product: HectorShell
    settings:
      base:
        PRODUCT_NAME: Aki
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.aki
        INFOPLIST_FILE: Aki/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Aki:
    build:
      targets:
        Aki: all
