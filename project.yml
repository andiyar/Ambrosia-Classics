# Ambrosia Classics — xcodegen spec. `xcodegen generate` writes AmbrosiaClassics.xcodeproj
# (git-ignored). Never hand-edit the pbxproj; this file is the truth.
name: AmbrosiaClassics
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  AkiCore:
    path: Aki/Core
  HectorKit:
    path: ../HectorKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Aki:
    type: application
    platform: macOS
    sources:
      - path: Aki/App
        excludes:
          - "Mac/Info.plist"
          - "iOS/**"
    dependencies:
      - package: AkiCore
        product: AkiCore
      - package: HectorKit
        product: HectorShell
    settings:
      base:
        PRODUCT_NAME: Aki
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.aki
        INFOPLIST_FILE: Aki/App/Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
  # The iPad app (plan C6, D7): the same shared Aki/App code over HectorShell's iOS shell, host in Aki/App/iOS.
  AkiPad:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Aki/App
        excludes:
          - "Mac/**"
          - "iOS/Info.plist"
    dependencies:
      - package: AkiCore
        product: AkiCore
      - package: HectorKit
        product: HectorShell
    settings:
      base:
        PRODUCT_NAME: Aki
        PRODUCT_BUNDLE_IDENTIFIER: com.ambrosiaclassics.aki.ipad
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        DEVELOPMENT_TEAM: 5W72UJL332
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_FILE: Aki/App/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMPRESS_PNG_FILES: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts:
      # The ORIGINAL Aki 1.2.0 Contents/Resources, unchanged, into the bundle root (before signing), plus
      # Apple's OsakaMono.ttf for the Release Notes (UIAppFonts) when this Mac has it — as tools/stage-aki.sh.
      - name: Copy original Aki data
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          DATA="${AKI_DATA_12:-$SRCROOT/Resources/Aki/1.2.0.app/Contents/Resources}"
          if [ ! -f "$DATA/map.png" ]; then
            echo "error: AkiPad: no Aki 1.2.0 Contents/Resources at $DATA (set AKI_DATA_12)" >&2
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          rsync -a --exclude '.DS_Store' --exclude '*.icns' "$DATA/" "$DEST/"
          # Remaster (D11): the git-ignored U1 art set into <bundle>/hd-4x/ when present (else Remaster shows
          # disabled), mirrored with --delete so a stale set never lingers in derived data;
          # AKI_REMASTER_BACKGROUNDS=plain|dedither (else a warning and plain) — dedither overlays
          # hd-4x-dedither/background*.png, a warning and plain when that set is absent (as tools/stage-aki.sh).
          HD="$SRCROOT/Resources/Aki/hd-4x"
          HD_DEDITHER="$SRCROOT/Resources/Aki/hd-4x-dedither"
          BACKGROUNDS="${AKI_REMASTER_BACKGROUNDS:-plain}"
          case "$BACKGROUNDS" in
            plain|dedither) ;;
            *) echo "warning: AkiPad: AKI_REMASTER_BACKGROUNDS must be plain or dedither (got $BACKGROUNDS); using plain"
               BACKGROUNDS=plain ;;
          esac
          if [ -d "$HD" ]; then
            rsync -a --delete --exclude '.DS_Store' "$HD/" "$DEST/hd-4x/"
            if [ "$BACKGROUNDS" = dedither ]; then
              set -- "$HD_DEDITHER"/background*.png             # POSIX glob test (/bin/sh): unmatched stays literal
              if [ -e "$1" ]; then
                cp "$HD_DEDITHER"/background*.png "$DEST/hd-4x/"
              else
                echo "warning: AkiPad: AKI_REMASTER_BACKGROUNDS=dedither but no $HD_DEDITHER/background*.png; plain backgrounds staged"
                BACKGROUNDS=plain
              fi
            fi
            echo "AkiPad: hd-4x staged ($(du -sh "$DEST/hd-4x" | cut -f1), backgrounds $BACKGROUNDS)"
          else
            rm -rf "$DEST/hd-4x"
            echo "warning: AkiPad: no $HD; Remastered Art will show disabled"
          fi
          OSAKA="$(find /System/Library/AssetsV2 -name OsakaMono.ttf -print -quit 2>/dev/null || true)"
          if [ -n "$OSAKA" ]; then
            cp "$OSAKA" "$DEST/OsakaMono.ttf"
          else
            echo "warning: AkiPad: OsakaMono.ttf not found under /System/Library/AssetsV2; Release Notes fall back to Menlo"
          fi
schemes:
  Aki:
    build:
      targets:
        Aki: all
  AkiPad:
    build:
      targets:
        AkiPad: all
